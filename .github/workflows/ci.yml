name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci
        working-directory: api

      - name: Rodar testes
        run: npm test
        working-directory: api

      - name: Construir imagem Docker
        run: docker build -t gastos-api ./api